        file: C:/Users/jasdi/Documents/Pinewave-graph-gen-test/Data_Files/R12-TB1-DR8DR4-ShutunShut_DUT_20260718_000913.xlsx
      - label: Ref
        file: C:/Users/jasdi/Documents/Pinewave-graph-gen-test/Data_Files/R12-TB1-DR8DR4-ShutunShut_Ref_20260721_003911.xlsx

  - name: Lane 1-1
