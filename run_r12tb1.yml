        file: C:/Users/jasdi/Documents/Pinewave-graph-gen-test/Data_Files/R12-TB1-ShutunShut-Ln1-1-DUT_20260719_081525.xlsx
      - label: Ref
        file: C:/Users/jasdi/Documents/Pinewave-graph-gen-test/Data_Files/R12-TB1-ShutunShut_Lane1_1_Ref_20260730_001350.xlsx

