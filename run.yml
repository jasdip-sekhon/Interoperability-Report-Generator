# What one report covers. Captures are listed rather than discovered, because which
# files pair is not something a filename can be trusted to say: a reset testcase is
# captured twice, DUT-run and Ref-run, and neither half is authoritative on its own.
#
# Each capture is charted on its own - a DUT run and a Ref run reset different
# hardware, so merging them would seam every time series. The merged yaml is still
# written, for the analysis stage that needs the union.

report: R12-TB1

topology: references/interconnects_sample.xlsx

testcases:
  - name: Soak
    captures:
      - references/soak_sample.xlsx

  - name: Reset
    recovery_commanded: true
    captures:
      - label: DUT
        file: references/reset_dut_sample.xlsx
      - label: Ref
        file: references/reset_ref_sample.xlsx
